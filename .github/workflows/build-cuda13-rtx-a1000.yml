name: Build stable-diffusion.cpp (Windows CUDA 13 - RTX A1000)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-windows-cuda13:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA 13 Toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '13.0.0'
          sub-packages: '["nvcc", "cublas", "cublas_dev", "cudart", "curand", "curand_dev"]'

      - name: Setup MSVC & Ninja
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSD_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES="86"

      - name: Build Release Binaries
        run: cmake --build build --config Release -j

      - name: Package Binaries
        run: |
          mkdir dist
          Copy-Item build\bin\*.exe dist\
          Copy-Item build\bin\*.dll dist\ -ErrorAction SilentlyContinue

      - name: Upload Windows CUDA 13 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd-master-bin-win-cuda13-rtx-a1000
          path: dist/
